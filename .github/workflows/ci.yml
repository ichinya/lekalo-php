name: Package CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
jobs:
  php:
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3', '8.4', '8.5', '8.6']
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: tokenizer
          tools: none
      - run: php -n tests/protocol.php
      - run: php -n tests/analyzer.php
      - run: php -n tests/composition.php
      - name: Check reproducible runtime composition
        run: |
          php -n build.php --output "$RUNNER_TEMP/adapter.php"
          php -n build.php --output "$RUNNER_TEMP/adapter.php" --check
  services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --manifest-path crates/discovery/Cargo.toml
      - run: cargo test --locked --manifest-path crates/expressions/Cargo.toml
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: tokenizer
          tools: none
      - uses: ichinya/lekalo-adapter-sdk/.github/actions/package-contract@727243fd12b0eb52409ddb41d8bbbfa143098191
        with:
          host: 9eb07ce8f21f96a9a160d382ac6280b9fa0fbcbe

      - name: Verify the published PHP schemas
        run: |
          npm install --prefix "$RUNNER_TEMP/lekalo-php-schemas" --ignore-scripts --no-audit --no-fund --no-save ajv@8.20.0
          NODE_PATH="$RUNNER_TEMP/lekalo-php-schemas/node_modules" node tests/contract-schemas.mjs

  expression-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: ichinya/lekalo-adapter-sdk/.github/actions/stage-host-tests@ebe6ce17bd948d52850fb1a600e07a1ddbee7062
        with:
          host: 9eb07ce8f21f96a9a160d382ac6280b9fa0fbcbe
      - uses: dtolnay/rust-toolchain@stable
      - run: node scripts/external-tool.mjs --provision
      - run: node scripts/external-tool.mjs --build-services
      - uses: ichinya/lekalo-adapter-sdk/.github/actions/expression-conformance@1053547d61d6d2a0ae2310a035ab9ab8d672930d
