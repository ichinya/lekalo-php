name: Host integration
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
jobs:
  compatibility:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: ichinya/lekalo-adapter-sdk/.github/actions/stage-host-tests@ebe6ce17bd948d52850fb1a600e07a1ddbee7062
        with:
          host: 9eb07ce8f21f96a9a160d382ac6280b9fa0fbcbe
      - name: Provision pinned external integration packages
        run: node scripts/external-tool.mjs --provision
      - name: Use physical temporary paths for synthetic project fixtures
        run: |
          node --input-type=module <<'NODE'
          import {appendFileSync, realpathSync} from 'node:fs';
          import {tmpdir} from 'node:os';
          // The native Windows resolver also expands 8.3 names.
          const root = realpathSync.native(tmpdir());
          for (const name of ['TEMP', 'TMP', 'TMPDIR']) {
            appendFileSync(process.env.GITHUB_ENV, `${name}=${root}\n`);
          }
          NODE
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the pinned host and its selected fixture services
        shell: bash
        run: |
          set -euo pipefail
          node scripts/external-tool.mjs --build-services
          cargo build --locked -p lekalo-cli --bins
          node -e 'const p=require("node:path"), fs=require("node:fs"), ext=process.platform==="win32"?".exe":""; for(const [k,n] of [["LEKALO_BIN","lekalo"],["LEKALO_DEBUG_BIN","lekalo"],["LEKALO_SDK_ORACLE","adapter-sdk-oracle"]]) fs.appendFileSync(process.env.GITHUB_ENV,k+"="+p.resolve("target/debug/"+n+ext)+"\n")'
      - name: Provision PHP 8.3 (issue #54, visible setup step, no project install)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          # Composer is needed on every OS by the issue #56 fixture
          # provisioning step (the locked vendor tree is not committed).
          tools: composer
          # The locked Laravel runtime of the issue #56 fixture needs its
          # platform extensions; every dependency-free suite is unaffected.
          extensions: mbstring, openssl, pdo_sqlite, sqlite3, tokenizer, xml, dom, xmlwriter, ctype, fileinfo, iconv, session
        id: php
      - name: Run the Mago integration gate, fake mode (issue #55)
        # Requires PHP but no Mago binary and no network: the receipt
        # decoder, the analysis states, and the strict-profile gates run
        # against the committed artifact with injected fakes.
        run: node scripts/test-mago-integration.mjs --fake

  mago-real:
    name: Mago real-toolchain gate (issue #55)
    # The real-toolchain leg: installs the checksum-pinned Mago release
    # as a visible setup step outside the checkout, then runs the real
    # suite with --require-available. A missing tool fails this job; a
    # skipped leg is visible and never counts as Mago acceptance.
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: ichinya/lekalo-adapter-sdk/.github/actions/stage-host-tests@ebe6ce17bd948d52850fb1a600e07a1ddbee7062
        with:
          host: 9eb07ce8f21f96a9a160d382ac6280b9fa0fbcbe
      - name: Install the pinned PHP packages and compatibility artifact
        run: node scripts/external-tool.mjs --provision-php
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          package-manager-cache: false
      - name: Provision PHP 8.3 (no extensions, no Composer tools)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: none
          extensions: none
      - name: Install the pinned Mago toolchain (checksum-verified, outside the checkout)
        run: |
          set -euo pipefail
          LOCK=tests/external/lekalo-php/mago-toolchain.lock.json
          PIN_VERSION=$(node -p "require('./$LOCK').tool.version")
          test "$PIN_VERSION" = "1.0.0"
          # Resolve THIS runner's platform entry from the lock — the
          # digest is custody, not decoration.
          read -r _PLATFORM ARCHIVE WANT_SHA <<EOF
          $(node -e "
            const lock = require('./$LOCK');
            const platform = process.arch === 'arm64' && process.platform === 'darwin'
              ? 'aarch64-apple-darwin'
              : 'x86_64-unknown-linux-gnu';
            const artifact = lock.probe.artifacts.find((a) => a.platform === platform);
            if (!artifact) { console.error('no pinned artifact for ' + platform); process.exit(1); }
            console.log(artifact.platform, artifact.archive, artifact.archiveSha256);
          ")
          EOF
          ARCHIVE_CACHE="$RUNNER_TOOL_CACHE/mago-archives/$WANT_SHA/$ARCHIVE"
          if test -f "$ARCHIVE_CACHE"; then
            cp "$ARCHIVE_CACHE" "$RUNNER_TEMP/mago-archive"
          else
            curl -sSfL --retry 3 -o "$RUNNER_TEMP/mago-archive" \
              "https://github.com/carthage-software/mago/releases/download/${PIN_VERSION}/${ARCHIVE}"
          fi
          # Fail-closed verification: the downloaded archive must match
          # the pinned digest byte for byte, or the job stops here.
          echo "${WANT_SHA}  $RUNNER_TEMP/mago-archive" | sha256sum --check --strict
          if test -w "$RUNNER_TOOL_CACHE"; then
            mkdir -p "$(dirname "$ARCHIVE_CACHE")"
            cp "$RUNNER_TEMP/mago-archive" "$ARCHIVE_CACHE"
          fi
          mkdir -p "$RUNNER_TEMP/mago-bin"
          tar -xzf "$RUNNER_TEMP/mago-archive" -C "$RUNNER_TEMP/mago-bin"
          BIN=$(find "$RUNNER_TEMP/mago-bin" -type f -name mago | head -1)
          test -n "$BIN"
          chmod +x "$BIN"
          echo "LEKALO_MAGO=$BIN" >> "$GITHUB_ENV"
      - name: Run the Mago integration gate, real mode
        run: node scripts/test-mago-integration.mjs --real --require-available
